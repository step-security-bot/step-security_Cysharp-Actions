name: Unity Builder
description: "Composite action that wraps game-ci/unity-builder with serial masking for secure CI builds."
inputs:
  targetPlatform:
    required: true
    default: ""
    description: "The Unity build target platform (e.g. StandaloneLinux64, StandaloneWindows64)."
  unityVersion:
    required: false
    default: "auto"
    description: 'Unity editor version to use. Set to "auto" to detect from ProjectSettings/ProjectVersion.txt.'
  projectPath:
    required: true
    default: ""
    description: "Relative path from the repository root to the Unity project directory."
  buildMethod:
    required: true
    default: ""
    description: "Fully-qualified static method (Namespace.Class.Method) invoked to execute the build."
  customParameters:
    required: false
    default: ""
    description: "Additional command-line arguments forwarded to the Unity build process."
  versioning:
    required: false
    default: "None"
    description: "Versioning strategy applied during the build (e.g. None, Semantic, Custom)."

runs:
  using: "composite"
  steps:
    - name: Mask Unity serial number
      shell: bash
      run: echo "::add-mask::$(echo ${{ env.UNITY_SERIAL }} | sed 's/....$//')XXXX"
    - name: Run Unity build
      uses: step-security/unity-builder@release
      with:
        targetPlatform: ${{ inputs.targetPlatform }}
        unityVersion: ${{ inputs.unityVersion }}
        projectPath: ${{ inputs.projectPath }}
        buildMethod: ${{ inputs.buildMethod }}
        customParameters: ${{ inputs.customParameters }}
        versioning: ${{ inputs.versioning }}
